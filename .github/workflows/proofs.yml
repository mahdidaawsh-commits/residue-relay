name: StudioNet coded-record reconstruction proofs
run-name: ResidueRelay - ${{ inputs.scenario }}
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Independent coded-record case
        type: choice
        default: clean
        options: [clean, corrupt, erasures, ambiguous]
permissions:
  contents: read
concurrency:
  group: residue-relay-studionet-${{ inputs.scenario }}
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESIDUE_SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tools
        run: |
          pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund
          genvm-lint download --version v0.2.16
      - name: Lint and run independent finite-field and validator tests
        run: |
          genvm-lint check contracts/residue_relay.py --json
          node --test tests/rpc-preflight.test.cjs
          python -m pytest tests/direct -q --junitxml=proofs/cloud-direct-tests.xml
          python scripts/export-direct.py
          node scripts/check-direct.cjs
      - name: Prepare encrypted disposable CLI caller
        run: node scripts/bootstrap-ci.cjs
      - name: Deploy and exercise acquisition, decoding and repair recording
        run: node scripts/live-proof.cjs
      - name: Re-fetch receipts, code, full observations and all views
        run: node scripts/verify-proofs.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studionet-proofs
          path: |
            proofs/*.json
            proofs/*.xml
